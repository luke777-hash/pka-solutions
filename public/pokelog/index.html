<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Pokelog para ATK 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<script>try{var t=localStorage.getItem("pkahub-tema");if(t==="escuro")document.documentElement.dataset.theme="dark";if(t==="claro")document.documentElement.dataset.theme="light";}catch(e){}</script>
<style>
/* Layout: faixa verde com o placar de pontos no topo, depois avisos do guia, filtros e os quatro grupos (1k, 1.5k, 3k, 4k) em cards por rota. */
:root{
  --bg:#eef2f1; --surface:#ffffff; --surface-2:#e8eeec; --line:#d3dcd9;
  --fg:#12201c; --muted:#53645f; --faint:#83938e;
  --pl:#127a62; --pl-ink:#ffffff; --pl-soft:#d6efe7; --pl-faixa:#0f6b56;
  --shiny:#a77a06; --shiny-soft:#fbefcc;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1513; --surface:#15201d; --surface-2:#1c2a26; --line:#283a35;
  --fg:#e5eeeb; --muted:#9db0aa; --faint:#6c807a;
  --pl:#3cc9a2; --pl-ink:#06231b; --pl-soft:#173a31; --pl-faixa:#0f4f40;
  --shiny:#f0c24a; --shiny-soft:#3a3016;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e1513; --surface:#15201d; --surface-2:#1c2a26; --line:#283a35;
  --fg:#e5eeeb; --muted:#9db0aa; --faint:#6c807a;
  --pl:#3cc9a2; --pl-ink:#06231b; --pl-soft:#173a31; --pl-faixa:#0f4f40;
  --shiny:#f0c24a; --shiny-soft:#3a3016;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--pl);outline-offset:2px}

/* faixa do topo */
.faixa{background:var(--pl-faixa);color:#fff}
.faixa .wrap{padding-block:26px 22px;display:grid;gap:18px}
.faixa-topo{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap}
.faixa h1{margin:0;font:800 clamp(26px,4vw,38px)/1.05 var(--f-display);letter-spacing:-.02em}
.faixa .sub{margin:6px 0 0;color:rgba(255,255,255,.82);max-width:72ch;text-wrap:pretty}
.credito{margin:8px 0 0;font-size:13.5px;color:rgba(255,255,255,.78)}
.credito a{color:#fff;font-weight:600}
.tema{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border-radius:999px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;transition:background-color .2s ease}
.tema:hover{background:rgba(255,255,255,.24)}
.tema svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* placar */
.placar{display:grid;grid-template-columns:auto 1fr;gap:6px 22px;align-items:end;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.18);border-radius:var(--r);padding:16px 18px}
.placar .pts{font:800 clamp(34px,6vw,52px)/1 var(--f-display);letter-spacing:-.02em;white-space:nowrap}
.placar .pts small{font-size:.45em;font-weight:700;color:rgba(255,255,255,.75);margin-left:4px}
.placar .detalhe{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;color:rgba(255,255,255,.85);padding-bottom:4px}
.placar .detalhe b{color:#fff}
.barra{grid-column:1/-1;height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
.barra i{position:absolute;inset:0 auto 0 0;width:0;background:#fff;border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.barra.ok i{background:#ffe07a}
.placar .msg{grid-column:1/-1;margin:0;font-size:13.5px;color:rgba(255,255,255,.85)}

main.wrap{padding-block:26px 64px;display:grid;gap:26px}

/* avisos do guia */
.avisos{columns:4 220px;column-gap:28px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 20px 8px}
.aviso{break-inside:avoid;padding-bottom:12px}
.aviso h3{margin:0 0 4px;font:700 12.5px/1.3 var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--pl)}
.aviso ul{margin:0;padding-left:18px;font-size:14px;color:var(--muted)}
.aviso li+li{margin-top:2px}

/* filtros */
.filtros{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 0;background:var(--bg)}
.busca{flex:1 1 220px;max-width:340px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px}
.busca svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--faint);stroke-width:2;stroke-linecap:round}
.busca input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:inherit;font-size:15px;padding:9px 0;outline:none}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;transition:background-color .2s ease,color .2s ease}
.seg button[aria-pressed="true"]{background:var(--pl);color:var(--pl-ink)}
.saltos{display:flex;flex-wrap:wrap;gap:6px}
.saltos a{font-size:13.5px;font-weight:600;color:var(--fg);text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 11px;transition:border-color .2s ease}
.saltos a:hover{border-color:var(--pl)}
.saltos a span{color:var(--muted);font-weight:500;margin-left:4px}

/* grupos */
#grupos{display:grid;gap:36px}
.grupo{display:grid;gap:12px;scroll-margin-top:64px}
.grupo-cab{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grupo h2{margin:0;font:800 23px/1.2 var(--f-display);letter-spacing:-.01em}
.grupo .soma{font-size:14px;color:var(--muted)}
.grupo .soma b{color:var(--fg)}
.rotas{display:flex;flex-wrap:wrap;gap:12px}
.rota{--n:1;flex:var(--n) 1 calc(var(--n) * 196px);min-width:0;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:10px;transition:border-color .25s ease,transform .2s ease}
.rota.feita{border-color:var(--pl)}
@media (hover:hover){.rota:hover{transform:translateY(-2px)}}
.rota .nota{margin:auto 0 0;font-size:13px;color:var(--muted);line-height:1.4}
.pokes{display:flex;gap:8px}
@media (max-width:820px){.pokes{flex-wrap:wrap}}
.poke{flex:1 1 104px;min-width:0;display:grid;justify-items:center;gap:6px;padding:8px 6px 8px;border-radius:11px;background:var(--surface-2);position:relative}
.poke .foto{height:76px;width:100%;display:grid;place-items:center}
.poke img{max-height:76px;max-width:100%;object-fit:contain;transition:transform .25s ease,filter .25s ease}
.poke.faltando img{filter:saturate(.75)}
.poke .nome{font-weight:700;font-size:14.5px;line-height:1.2;text-align:center}
.poke .nome .rep{display:block;font-size:11.5px;font-weight:500;color:var(--faint)}
.marcas{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.marca{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 9px;font-size:12.5px;font-weight:600;color:var(--muted);cursor:pointer;transition:background-color .2s ease,color .2s ease,border-color .2s ease,transform .15s ease}
.marca:active{transform:scale(.95)}
.marca svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.marca[aria-pressed="true"].log{background:var(--pl);border-color:var(--pl);color:var(--pl-ink)}
.marca[aria-pressed="true"].sh{background:var(--shiny-soft);border-color:var(--shiny);color:var(--shiny)}
.poke.brilha::after{content:"✦";position:absolute;top:6px;right:8px;color:var(--shiny);font-size:15px;animation:brilho 1.8s ease-in-out infinite}
@keyframes brilho{50%{opacity:.35;transform:scale(.8)}}
.pop{animation:pop .35s ease}
@keyframes pop{40%{transform:scale(1.12)}}
.vazio{padding:18px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);text-align:center}

/* rodapé */
.fim{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:18px;font-size:13.5px;color:var(--muted)}
.fim p{margin:0;max-width:70ch}
.fim a{color:var(--fg)}
.limpar{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 14px;font-size:14px;font-weight:600;cursor:pointer}
.limpar:hover{border-color:#c2412e;color:#c2412e}

@media (max-width:620px){
  .wrap{padding-inline:14px}
  .placar{grid-template-columns:1fr}
  .rota{flex-basis:calc(var(--n) * 150px)}
  .poke{flex-basis:96px}
  .poke .nome{font-size:13.5px}
    .filtros{position:static}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="pkahub-volta"><a class="pkahub-botao" href="/">← Todas as ferramentas</a></div>
<style>.pkahub-volta{padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line)}.pkahub-botao{display:inline-flex;align-items:center;min-height:32px;padding:4px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--fg);font-family:inherit;font-size:14px;font-weight:600;line-height:1.2;text-decoration:none}.pkahub-botao:hover{border-color:var(--fg)}</style>
<link rel="stylesheet" href="/apoio/apoio.css">
<script src="/apoio/apoio.js" defer></script>

<header class="faixa">
  <div class="wrap">
    <div class="faixa-topo">
      <div>
        <h1>Pokelog para ATK 5</h1>
        <p class="sub">Marque os pokelogs que você já completou e veja quanto falta para os pontos do ATK 5.</p>
        <p class="credito" id="credito"></p>
      </div>
      <button type="button" class="tema" id="tema"></button>
    </div>
    <div class="placar" aria-live="polite">
      <div class="pts" id="pts">0<small>/ 1.600</small></div>
      <div class="detalhe" id="detalhe"></div>
      <div class="barra" id="barra"><i></i></div>
      <p class="msg" id="msg"></p>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="avisos" id="avisos" aria-label="Avisos importantes do guia"></section>

  <div class="filtros">
    <label class="busca"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="busca" type="search" placeholder="Buscar pokémon" aria-label="Buscar pokémon" autocomplete="off"></label>
    <div class="seg" id="seg" role="group" aria-label="Mostrar">
      <button type="button" data-f="todos" aria-pressed="true">Todos</button>
      <button type="button" data-f="faltando" aria-pressed="false">Faltando</button>
      <button type="button" data-f="feitos" aria-pressed="false">Feitos</button>
    </div>
    <nav class="saltos" id="saltos" aria-label="Ir para o grupo"></nav>
  </div>

  <div id="grupos"></div>

  <footer class="fim">
    <p>As marcações ficam salvas só neste navegador. Animações dos pokémons: Pokémon Showdown, via PokeAPI.</p>
    <button type="button" class="limpar" id="limpar">Limpar marcações</button>
  </footer>
</main>

<script src="/pokelog/dados.js"></script>
<script>
(function(){
  "use strict";
  var P = window.POKELOG;
  var IMG = window.POKELOG_IMG || "/pokelog/img/";
  var CHAVE = "pkahub-pokelog";
  var nf = new Intl.NumberFormat("pt-BR");

  // número da pokédex de cada pokémon do guia (só para achar a imagem)
  var DEX = {"caterpie":10,"pineco":204,"weedle":13,"cleffa":173,"flabebe":669,"igglybuff":174,"oddish":43,"paras":46,"pidgey":16,"rattata":19,"spearow":21,"abra":63,"drowzee":96,"aipom":190,"swinub":220,"smoochum":238,"chimchar":390,"clefairy":35,"combee":415,"cubone":104,"sandshrew":27,"phanpy":231,"cyndaquil":155,"slugma":218,"diglett":50,"eevee":133,"meowth":52,"floette":670,"snubbull":209,"gastly":92,"geodude":74,"gible":443,"growlithe":58,"charmander":4,"houndour":228,"deino":633,"krabby":98,"magnemite":81,"magby":240,"mareep":179,"pichu":172,"natu":177,"ponyta":77,"rhyhorn":111,"larvitar":246,"shieldon":410,"shinx":403,"skiddo":672,"slowpoke":79,"snover":459,"spinarak":167,"squirtle":7,"totodile":158,"marill":183,"starly":396,"timburr":532,"togepi":175,"trubbish":568,"turtwig":387,"voltorb":100,"vulpix":37,"wooper":194,"wurmple":265,"aron":304,"bagon":371,"baltoy":343,"barboach":339,"beldum":374,"cacnea":331,"charmeleon":5,"corphish":341,"dratini":147,"duskull":355,"electrode":101,"farfetchd":83,"fearow":22,"gabite":444,"graveler":75,"kadabra":64,"lotad":270,"machoke":67,"meditite":307,"murkrow":198,"numel":322,"parasect":47,"pidgeotto":17,"pikachu":25,"poochyena":261,"quilava":156,"ralts":280,"raticate":20,"shuckle":213,"shuppet":353,"slowbro":80,"snorunt":361,"spheal":363,"staravia":397,"swablu":333,"taillow":276,"torchic":255,"trapinch":328,"treecko":252,"tyrogue":236,"whismur":293,"yanma":193,"ariados":168,"carvanha":318,"chansey":113,"clefable":36,"cloyster":91,"combusken":256,"cranidos":408,"croconaw":159,"dodrio":85,"dragonair":148,"dugtrio":51,"dewgong":87,"espeon":196,"golduck":55,"grotle":388,"grovyle":253,"gulpin":316,"hitmonchan":107,"hitmonlee":106,"hitmontop":237,"hypno":97,"kirlia":281,"lairon":305,"lombre":271,"loudred":294,"luxio":404,"makuhita":296,"marowak":105,"marshtomp":259,"metang":375,"minun":312,"plusle":311,"monferno":391,"noctowl":164,"persian":53,"politoed":186,"primeape":57,"pupitar":247,"quagsire":195,"riolu":447,"sandslash":28,"sealeo":364,"shelgon":372,"sneasel":215,"starmie":121,"tangela":114,"togetic":176,"umbreon":197,"venomoth":49,"vibrava":329,"wailmer":320,"wigglytuff":40};

  function chaveDe(nome){ return nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’'.]/g,"").replace(/\s+/g,"-"); }
  function semAcento(t){ return t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }

  // monta a lista: cada pokémon conta uma vez, mesmo que apareça em mais de uma rota
  var especies = {}, ordem = [];
  P.grupos.forEach(function(g){
    g.rotas.forEach(function(r){
      r.pokes = r[0].split("+").map(function(s){ return s.trim(); });
      r.pokes.forEach(function(n){
        var k = chaveDe(n);
        if(!especies[k]){ especies[k] = {k:k, nome:n, grupo:g.id, dex:DEX[k]}; ordem.push(k); }
      });
    });
  });
  var TOTAL = ordem.length;

  var estado = {};
  try{ estado = JSON.parse(localStorage.getItem(CHAVE)||"{}") || {}; }catch(e){ estado = {}; }
  function salvar(){ try{ localStorage.setItem(CHAVE, JSON.stringify(estado)); }catch(e){} }
  function e(k){ return estado[k] || (estado[k] = {log:false, sh:false}); }

  var filtro = "todos", termo = "";

  function el(tag, cls, txt){ var x=document.createElement(tag); if(cls) x.className=cls; if(txt!=null) x.textContent=txt; return x; }
  var ICON_OK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17 19 7.5"/></svg>';

  function imagem(sp, shiny){
    var img = document.createElement("img");
    img.alt = (shiny?"Shiny ":"") + sp.nome;
    img.loading = "lazy";
    img.decoding = "async";
    img.dataset.v = shiny ? "shiny" : "normal";
    img.src = (window.POKELOG_SRC && window.POKELOG_SRC(sp.dex, shiny)) || IMG + (shiny?"shiny/":"") + sp.dex + ".gif";
    // se a animação não carregar, usa a imagem da wiki oficial
    img.onerror = function(){
      img.onerror = null;
      img.src = "https://wiki.pokealliance.com/pokemon/" + String(sp.dex).padStart(3,"0") + (shiny?".1":"") + ".png";
    };
    return img;
  }

  /* ---------- textos fixos ---------- */
  var cred = document.getElementById("credito");
  cred.append("Guia de " + P.autor + " (Servidor " + P.servidor + ", guild " + P.guild + "). ");
  var a = el("a", null, "Ver o documento original"); a.href = P.fonte; a.target = "_blank"; a.rel = "noopener";
  cred.append(a);

  var av = document.getElementById("avisos");
  P.avisos.forEach(function(x){
    var c = el("div","aviso"); c.appendChild(el("h3",null,x[0]));
    var ul = el("ul"); x[1].forEach(function(t){ ul.appendChild(el("li",null,t)); }); c.appendChild(ul);
    av.appendChild(c);
  });

  var saltos = document.getElementById("saltos");
  P.grupos.forEach(function(g){
    var l = el("a"); l.href = "#g-" + g.id.replace(".","-"); l.dataset.g = g.id;
    l.append(g.id); l.appendChild(el("span")); saltos.appendChild(l);
  });

  /* ---------- cards ---------- */
  var host = document.getElementById("grupos");
  var refs = {}; // k -> lista de {poke, log, sh, img}

  function montar(){
    host.innerHTML = ""; refs = {};
    P.grupos.forEach(function(g){
      var sec = el("section","grupo"); sec.id = "g-" + g.id.replace(".","-");
      var cab = el("div","grupo-cab");
      cab.appendChild(el("h2",null,g.nome));
      var soma = el("span","soma"); soma.dataset.g = g.id; cab.appendChild(soma);
      sec.appendChild(cab);
      var grade = el("div","rotas");
      g.rotas.forEach(function(r){
        var card = el("article","rota"); card.style.setProperty("--n", r.pokes.length); card._pokes = r.pokes.map(chaveDe); card._texto = semAcento(r[0] + " " + r[1]);
        var lista = el("div","pokes");
        r.pokes.forEach(function(n){
          var sp = especies[chaveDe(n)];
          var box = el("div","poke");
          var foto = el("div","foto"); var img = imagem(sp, e(sp.k).sh); foto.appendChild(img); box.appendChild(foto);
          var nome = el("div","nome", sp.nome);
          if(sp.grupo !== g.id){ var rep = el("span","rep","conta no grupo " + sp.grupo); nome.appendChild(rep); }
          box.appendChild(nome);
          var marcas = el("div","marcas");
          var bLog = el("button","marca log"); bLog.type="button"; bLog.innerHTML = ICON_OK + "<span>Log +" + P.pontosLog + "</span>";
          bLog.setAttribute("aria-label", "Pokelog de " + sp.nome + " completo, " + P.pontosLog + " pontos");
          var bSh = el("button","marca sh"); bSh.type="button"; bSh.innerHTML = "<span>✦ Shiny +" + P.pontosShiny + "</span>";
          bSh.setAttribute("aria-label", "Primeiro pokelog do Shiny " + sp.nome + ", " + P.pontosShiny + " pontos");
          bLog.onclick = function(){ e(sp.k).log = !e(sp.k).log; mudou(sp.k, bLog); };
          bSh.onclick = function(){ e(sp.k).sh = !e(sp.k).sh; mudou(sp.k, bSh); };
          marcas.appendChild(bLog); marcas.appendChild(bSh); box.appendChild(marcas);
          lista.appendChild(box);
          (refs[sp.k] || (refs[sp.k] = [])).push({box:box, log:bLog, sh:bSh, img:img, sp:sp, card:card});
        });
        card.appendChild(lista);
        if(r[1]) card.appendChild(el("p","nota", r[1]));
        grade.appendChild(card);
      });
      sec.appendChild(grade);
      var vazio = el("div","vazio","Nenhum pokémon deste grupo com esse filtro."); vazio.hidden = true; sec.appendChild(vazio);
      sec._grade = grade; sec._vazio = vazio;
      host.appendChild(sec);
    });
  }

  function pintar(k, anima){
    var s = e(k);
    (refs[k]||[]).forEach(function(r){
      r.log.setAttribute("aria-pressed", String(s.log));
      r.sh.setAttribute("aria-pressed", String(s.sh));
      r.box.classList.toggle("faltando", !s.log);
      r.box.classList.toggle("brilha", s.sh);
      var quer = s.sh ? "shiny" : "normal";
      if(r.img.dataset.v !== quer){ var novo = imagem(r.sp, s.sh); r.img.replaceWith(novo); r.img = novo; }
      if(anima && anima.closest && r.box.contains(anima)){ r.box.classList.remove("pop"); void r.box.offsetWidth; r.box.classList.add("pop"); }
    });
  }

  function mudou(k, botao){ salvar(); pintar(k, botao); placar(); filtrar(); }

  function placar(){
    var logs=0, sh=0, porGrupo={};
    ordem.forEach(function(k){
      var s = estado[k]; var g = especies[k].grupo;
      porGrupo[g] = porGrupo[g] || {feitos:0,total:0,pts:0}; porGrupo[g].total++;
      if(s && s.log){ logs++; porGrupo[g].feitos++; porGrupo[g].pts += P.pontosLog; }
      if(s && s.sh){ sh++; porGrupo[g].pts += P.pontosShiny; }
    });
    var pts = logs*P.pontosLog + sh*P.pontosShiny;
    document.getElementById("pts").innerHTML = nf.format(pts) + "<small>/ " + nf.format(P.meta) + "</small>";
    document.getElementById("detalhe").innerHTML = "<span><b>" + logs + "</b> de " + TOTAL + " pokelogs</span><span><b>" + sh + "</b> shinies</span><span>até " + nf.format(TOTAL*(P.pontosLog+P.pontosShiny)) + " pontos possíveis neste guia</span>";
    var barra = document.getElementById("barra");
    barra.querySelector("i").style.width = Math.min(100, pts/P.meta*100).toFixed(1) + "%";
    barra.classList.toggle("ok", pts >= P.meta);
    var falta = P.meta - pts;
    document.getElementById("msg").textContent = falta > 0
      ? "Faltam " + nf.format(falta) + " pontos para o ATK 5 (" + Math.ceil(falta/(P.pontosLog+P.pontosShiny)) + " pokelogs fazendo também o primeiro do shiny)."
      : "Meta do ATK 5 atingida!";
    Array.prototype.forEach.call(document.querySelectorAll(".soma"), function(x){
      var v = porGrupo[x.dataset.g] || {feitos:0,total:0,pts:0};
      x.innerHTML = "<b>" + v.feitos + "</b> de " + v.total + " feitos · " + nf.format(v.pts) + " pts";
    });
    Array.prototype.forEach.call(saltos.querySelectorAll("a"), function(l){
      var v = porGrupo[l.dataset.g] || {feitos:0,total:0}; l.querySelector("span").textContent = v.feitos + "/" + v.total;
    });
  }

  function filtrar(){
    var t = semAcento(termo.trim());
    Array.prototype.forEach.call(host.querySelectorAll(".grupo"), function(sec){
      var vis = 0;
      Array.prototype.forEach.call(sec._grade.children, function(card){
        var feitos = card._pokes.every(function(k){ return estado[k] && estado[k].log; });
        card.classList.toggle("feita", feitos);
        var ok = (!t || card._texto.indexOf(t) >= 0) &&
                 (filtro === "todos" || (filtro === "feitos" ? feitos : !feitos));
        card.hidden = !ok; if(ok) vis++;
      });
      sec._vazio.hidden = vis > 0;
    });
  }

  document.getElementById("busca").addEventListener("input", function(ev){ termo = ev.target.value; filtrar(); });
  document.getElementById("seg").addEventListener("click", function(ev){
    var b = ev.target.closest("button"); if(!b) return;
    filtro = b.dataset.f;
    Array.prototype.forEach.call(this.querySelectorAll("button"), function(x){ x.setAttribute("aria-pressed", String(x === b)); });
    filtrar();
  });
  document.getElementById("limpar").addEventListener("click", function(){
    if(!confirm("Apagar todas as marcações de pokelog deste navegador?")) return;
    estado = {}; salvar(); ordem.forEach(function(k){ pintar(k); }); placar(); filtrar();
  });

  /* ---------- tema (mesma chave do hub) ---------- */
  var bTema = document.getElementById("tema");
  function temaAtual(){
    var d = document.documentElement.dataset.theme;
    if(d === "dark") return "escuro"; if(d === "light") return "claro";
    return matchMedia("(prefers-color-scheme: dark)").matches ? "escuro" : "claro";
  }
  function pintarTema(){
    var t = temaAtual();
    bTema.innerHTML = (t === "escuro"
      ? '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg><span>Escuro</span>'
      : '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg><span>Claro</span>');
    var prox = t === "escuro" ? "claro" : "escuro";
    bTema.setAttribute("aria-label", "Mudar para o tema " + prox); bTema.title = "Mudar para o tema " + prox;
  }
  bTema.addEventListener("click", function(){
    var novo = temaAtual() === "escuro" ? "claro" : "escuro";
    document.documentElement.dataset.theme = novo === "escuro" ? "dark" : "light";
    try{ localStorage.setItem("pkahub-tema", novo); }catch(e){}
    pintarTema();
  });

  montar(); ordem.forEach(function(k){ pintar(k); }); placar(); filtrar(); pintarTema();
})();
</script>
</body>
</html>
